[package]
name = "lamzu-battery-monitor"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
flexi_logger = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hidapi = "2.6"
tray-icon = "0.19"
ctrlc = "3.4"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Data_Xml_Dom",
    "UI_Notifications",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
