name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Speed up Windows builds by disabling incremental compilation in CI.
  CARGO_INCREMENTAL: 0

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint & format check (fast feedback, runs before the heavier build)
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # Release build + artifact upload
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamzu-battery-monitor-windows-x64
          path: target/release/lamzu-battery-monitor.exe
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Automated GitHub Release on version tags (e.g. v1.0.0)
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lamzu-battery-monitor-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lamzu-battery-monitor.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
